<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maintenance Performance Suite · SAP PM + Power BI</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --navy:#0E1C33; --blue:#2F6FED; --orange:#D97706; --light:#EEF2F8;
  --ice:#B8C9E4; --ink:#101828; --grey:#5A6473; --card:#FFFFFF; --line:#E4E9F2;
  --green:#12805C; --amber:#B54708; --red:#B42318; --bg:#F4F6FA;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Calibri,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
.app{display:flex;min-height:100vh}
.side{width:224px;background:var(--navy);color:#fff;display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh}
.brand{padding:16px 15px;border-bottom:1px solid #1B3A5F}
.brand .t1{font-size:9.5px;letter-spacing:2px;color:var(--ice);font-weight:bold}
.brand .t2{font-size:15px;font-weight:bold;margin-top:3px;line-height:1.2;color:#fff}
.brand .t3{font-size:9px;color:#8FA6C4;margin-top:7px;font-family:Consolas,monospace}
.nav{flex:1;overflow-y:auto;padding:7px 0}
.nav button{width:100%;text-align:left;background:none;border:none;color:#CBD8EA;padding:8px 15px;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:9px;border-left:3px solid transparent;font-family:inherit}
.nav button:hover{background:#1B3A5F;color:#fff}
.nav button.active{background:#1B3A5F;color:#fff;border-left-color:var(--orange);font-weight:bold}
.nav .num{display:inline-flex;width:19px;height:19px;border-radius:50%;background:#2A4E7E;font-size:10.5px;align-items:center;justify-content:center;flex-shrink:0}
.nav button.active .num{background:var(--orange)}
.side .foot{padding:11px 15px;font-size:9.5px;color:#8FA6C4;border-top:1px solid #1B3A5F;line-height:1.5}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:11px 20px;display:flex;align-items:center;gap:13px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.topbar h1{font-size:18px;color:var(--navy);font-weight:bold;margin-right:auto}
.topbar .sub{font-size:11.5px;color:var(--grey);font-weight:normal;display:block;margin-top:2px}
.toggle{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.toggle button{border:none;background:#fff;padding:7px 13px;font-size:12px;cursor:pointer;color:var(--grey);font-family:inherit}
.toggle button.on{background:var(--navy);color:#fff;font-weight:bold}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 12px;font-size:12px;cursor:pointer;color:var(--navy);font-family:inherit}
.btn:hover{background:var(--light)}
.filters{background:#fff;border-bottom:1px solid var(--line);padding:9px 20px;display:flex;gap:13px;flex-wrap:wrap;align-items:flex-end}
.filters.hidden{display:none}
.fl{display:flex;flex-direction:column;gap:3px}
.fl label{font-size:9.5px;color:var(--grey);text-transform:uppercase;letter-spacing:.5px}
.fl select{border:1px solid var(--line);border-radius:5px;padding:5px 8px;font-size:12px;font-family:inherit;color:var(--ink);background:#fff;min-width:118px}
.fl select:focus{outline:2px solid var(--blue);outline-offset:-1px}
.fstat{margin-left:auto;font-size:11px;color:var(--navy);background:var(--light);border:1px solid var(--line);border-radius:6px;padding:5px 11px;font-family:Consolas,monospace}
.canvas{padding:16px 20px 28px;flex:1}
.grid{display:grid;gap:13px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 15px;box-shadow:0 1px 3px rgba(20,40,80,.06);transition:box-shadow .15s}
.card:hover{box-shadow:0 4px 14px rgba(16,24,40,.10)}
.card h3{font-size:13px;color:var(--navy);font-weight:700;margin-bottom:2px}
.card .cap{font-size:11px;color:var(--grey);margin-bottom:9px}
.sapchip{display:inline-block;margin-left:7px;padding:1px 7px;border-radius:9px;background:var(--light);color:#33507F;font-size:9px;font-weight:700;border:1px solid var(--line);vertical-align:middle;font-family:Consolas,monospace}
.kpi{position:relative}
.kpi .lbl{font-size:11.5px;color:var(--grey)}
.kpi .val{font-size:29px;font-weight:bold;color:var(--navy);font-family:Georgia,serif;line-height:1.1;margin-top:3px}
.kpi .meta{font-size:10.5px;margin-top:4px}
.kpi .dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle}
.kpi .trend{position:absolute;top:13px;right:15px;font-size:11.5px;font-weight:bold}
.up{color:var(--green)}.down{color:var(--red)}.flat{color:var(--amber)}
.s-g{background:var(--green)}.s-a{background:var(--amber)}.s-r{background:var(--red)}
.chart-wrap{position:relative;height:225px}.chart-sm{height:175px}.chart-lg{height:295px}
.full{grid-column:1/-1}
.pilars{display:flex;flex-direction:column;gap:8px}
.pilar{display:flex;align-items:center;gap:9px;font-size:12px}
.pilar .bar{flex:1;height:8px;background:var(--light);border-radius:4px;overflow:hidden}
.pilar .bar i{display:block;height:100%}
.sem{width:11px;height:11px;border-radius:50%;flex-shrink:0}
table.tbl{width:100%;border-collapse:collapse;font-size:11.5px}
table.tbl th{background:var(--navy);color:#fff;text-align:left;padding:6px 8px;font-weight:bold;font-size:10.5px}
table.tbl td{padding:5px 8px;border-bottom:1px solid var(--line)}
table.tbl tr:nth-child(even){background:var(--light)}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:bold}
.p-open{background:#FDECEA;color:var(--red)}.p-late{background:#FCF0DC;color:var(--amber)}.p-ok{background:#E3F1EB;color:var(--green)}
.gerencial .tech-only{display:none}
.heat{display:grid;gap:3px;font-size:10.5px}
.heat .h{font-weight:bold;color:var(--grey);text-align:center;padding:3px 0}
.heat .rl{color:var(--ink);display:flex;align-items:center;font-weight:bold;font-size:11px}
.heat .c{height:26px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:10px}
.insight{background:linear-gradient(180deg,#FFF 0%,#FAFBFE 100%);border:1px solid var(--line);border-left:4px solid var(--orange);border-radius:10px;padding:14px 17px;box-shadow:0 1px 3px rgba(20,40,80,.06);margin-top:13px}
.insight h4{font-size:11.5px;color:var(--orange);font-weight:700;letter-spacing:1.1px;text-transform:uppercase;margin-bottom:9px}
.insight .cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px}
.insight .cl b{display:block;font-size:11.5px;color:var(--navy);margin-bottom:4px}
.insight .cl p{font-size:12px;color:var(--ink);line-height:1.55;margin:0}
.insight em{font-style:normal;font-weight:700;color:var(--navy)}
.insight .dec{margin-top:11px;padding-top:10px;border-top:1px dashed var(--line);font-size:12px;line-height:1.55}
.insight .dec b{color:var(--red)}
.mini{font-size:10.5px;color:var(--grey);margin-top:7px;font-style:italic;line-height:1.45}
.funnel{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.fstep{display:flex;align-items:center;gap:9px;font-size:11.5px}
.fstep .fn{width:146px}.fstep .fb{flex:1;height:24px;background:var(--light);border-radius:4px;overflow:hidden}
.fstep .fb i{display:block;height:100%}.fstep .fv{width:58px;text-align:right;font-weight:700;color:var(--navy)}
.fstep .fp{width:46px;text-align:right;font-size:10.5px;color:var(--grey)}
.lossrow{display:flex;align-items:center;gap:9px;font-size:11.5px;margin-bottom:7px}
.lossrow .nm{width:132px}.lossrow .bar{flex:1;height:14px;background:var(--light);border-radius:3px;overflow:hidden}
.lossrow .bar i{display:block;height:100%}.lossrow .vl{width:72px;text-align:right;font-weight:700;color:var(--navy)}
.pdca{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pdca div{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--light)}
.pdca b{color:var(--navy);font-size:11.5px;display:block;margin-bottom:2px}
.pdca span{font-size:10.5px;color:var(--grey)}
.src{font-size:10px;color:var(--grey);font-style:italic;margin-top:9px;line-height:1.45}
.empty{padding:38px 10px;text-align:center;color:var(--grey);font-size:12.5px;font-style:italic}
@media(max-width:1100px){.insight .cols{grid-template-columns:1fr}}
@media(max-width:900px){.g4{grid-template-columns:1fr 1fr}.g3,.g2{grid-template-columns:1fr}.side{width:60px}.brand .t2,.brand .t1,.brand .t3,.nav button span.txt,.side .foot{display:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="t1">OPERATIONS INTELLIGENCE</div>
      <div class="t2">Maintenance<br>Performance Suite</div>
      <div class="t3">SAP PM · MM · CO · PP → Power BI</div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot" id="foot"></div>
  </aside>
  <div class="main">
    <div class="topbar">
      <h1 id="ptitle">—<span class="sub" id="psub"></span></h1>
      <div class="toggle">
        <button id="vGer" class="on" onclick="setView('ger')">Vista Gerencial</button>
        <button id="vTec" onclick="setView('tec')">Vista Técnica</button>
      </div>
      <button class="btn" onclick="toggleFilters()">☰ Filtros</button>
      <button class="btn" onclick="resetFilters()">↺ Reset</button>
    </div>
    <div class="filters" id="filters"></div>
    <div class="canvas gerencial" id="canvas"></div>
  </div>
</div>

const MESES = D.meta.meses, ETIQ = D.meta.etiquetas;
const C={navy:'#0E1C33',blue:'#2F6FED',orange:'#D97706',green:'#12805C',amber:'#B54708',
         red:'#B42318',ice:'#8FAAD4',grey:'#98A2B3',slate:'#667085',violet:'#6941C6'};

/* ---- índices de columnas (ver PROJECT_SPEC §5) ---- */
const O={id:0,ym:1,area:2,lin:3,eq:4,eqn:5,crit:6,tipo:7,clase:8,est:9,hhP:10,hhR:11,
         cP:12,cR:13,dias:14,ret:15,flg:16,grp:17,pri:18,mot:19};
const A={id:0,ym:1,eq:2,eqn:3,area:4,lin:5,crit:6,causa:7,dur:8,cat:9,lig:10};
const P={ym:0,area:1,lin:2,ton:3,hOp:4,hDet:5};
const M={ym:0,mat:1,desc:2,area:3,qty:4,imp:5,cri:6};
const L={ym:0,plan:1,eq:2,eqn:3,area:4,crit:5,estr:6,ciclo:7,est:8};

/* ---- estado de filtros ---- */
const FS={periodo:'u12',area:'Todas',linea:'Todas',crit:'Todas',tipo:'Todas',equipo:D.equipos[0][0]};

const PERIODOS={
 'todo'   :{n:'Todo (2025–2026)', m:MESES},
 'u12'    :{n:'Últimos 12 meses', m:MESES.slice(-12)},
 '2026'   :{n:'2026',             m:MESES.filter(x=>x<'2026-13'&&x>'2025-12')},
 '2025'   :{n:'2025',             m:MESES.filter(x=>x<'2026-01')},
 '2026s2' :{n:'2026 · S2',        m:MESES.filter(x=>x>='2026-07')},
 '2026s1' :{n:'2026 · S1',        m:MESES.filter(x=>x>='2026-01'&&x<='2026-06')},
 '2025s2' :{n:'2025 · S2',        m:MESES.filter(x=>x>='2025-07'&&x<='2025-12')},
};

/* ---- motor de filtrado ---- */
function mesesSel(){return PERIODOS[FS.periodo].m;}
function okDim(area,lin,crit){
  return (FS.area==='Todas'||area===FS.area) &&
         (FS.linea==='Todas'||lin===FS.linea) &&
         (FS.crit==='Todas'||crit===FS.crit);
}
let CACHE=null, CKEY='';
function F(){
  const key=JSON.stringify(FS);
  if(key===CKEY&&CACHE) return CACHE;
  const ms=new Set(mesesSel());
  const ord=D.ordenes.filter(o=>ms.has(o[O.ym])&&okDim(o[O.area],o[O.lin],o[O.crit])&&
                                (FS.tipo==='Todas'||o[O.tipo]===FS.tipo));
  const avi=D.avisos.filter(a=>ms.has(a[A.ym])&&okDim(a[A.area],a[A.lin],a[A.crit]));
  const prd=D.produccion.filter(p=>ms.has(p[P.ym])&&
                (FS.area==='Todas'||p[P.area]===FS.area)&&(FS.linea==='Todas'||p[P.lin]===FS.linea));
  const con=D.consumos.filter(c=>ms.has(c[M.ym])&&(FS.area==='Todas'||c[M.area]===FS.area));
  const pln=D.planes.filter(p=>ms.has(p[L.ym])&&(FS.area==='Todas'||p[L.area]===FS.area)&&
                (FS.crit==='Todas'||p[L.crit]===FS.crit));
  CACHE={ord,avi,prd,con,pln,meses:mesesSel()}; CKEY=key;
  return CACHE;
}

/* ---- utilidades ---- */
const sum=(a,f)=>a.reduce((s,x)=>s+(f(x)||0),0);
const pct=(a,b)=>b?a/b:0;
const fp =v=>(v*100).toFixed(1).replace('.',',')+'%';
const fp0=v=>Math.round(v*100)+'%';
const fm =v=>(v/1000).toLocaleString('es-CL',{minimumFractionDigits:1,maximumFractionDigits:1}); // k$ → M$
const fn =(v,d=1)=>Number(v).toFixed(d).replace('.',',');
const mi =v=>Math.round(v).toLocaleString('es-CL');
const etq=ym=>ETIQ[MESES.indexOf(ym)];
function agrupa(arr,k){const m=new Map();arr.forEach(x=>{const v=k(x);m.set(v,(m.get(v)||[]).concat([x]))});return m;}
function porMes(arr,idx,f){return mesesSel().map(ym=>{const s=arr.filter(x=>x[idx]===ym);return f(s);});}
function topN(map,f,n){return [...map.entries()].map(([k,v])=>[k,f(v)]).sort((a,b)=>b[1]-a[1]).slice(0,n);}

/* ---- métricas (§7 de la especificación) ---- */
const esCorr=o=>o[O.tipo]==='Correctivo'||o[O.tipo]==='Emergencia';
const esPrev=o=>o[O.tipo]==='Preventivo';
function KPI(d){
  const o=d.ord, n=o.length||1;
  const corr=o.filter(esCorr).length, prev=o.filter(esPrev).length;
  const cerr=o.filter(x=>x[O.est]==='Cerrada');
  const prevCerr=o.filter(x=>esPrev(x)&&x[O.est]==='Cerrada').length;
  const fallas=d.avi.filter(a=>a[A.cat]==='Averías').length||1;
  const hOp=sum(d.prd,p=>p[P.hOp]), hDet=sum(d.prd,p=>p[P.hDet]);
  // MTTR = duración media de parada declarada en el aviso (IW29), no HH de la orden
  const mttr=d.avi.length?sum(d.avi,a=>a[A.dur])/d.avi.length:0;
  // MTBF = horas-equipo operativas / n.º de averías
  const nEq=D.equipos.filter(e=>okDim(e[2],e[3],e[4])).length||1;
  const filas=d.prd.length||1, horasEq=(hOp/filas)*(d.meses?d.meses.length:1)*nEq;
  const mtbf=horasEq/fallas;
  const planCump=d.pln.filter(p=>p[L.est]==='Cumplido').length;
  const abiertas=o.filter(x=>x[O.est]==='Abierta');
  const backlogHH=sum(abiertas,x=>Math.max(0,x[O.hhP]-x[O.hhR]));
  const capSem=540*(FS.area==='Todas'?1:0.4);
  const flags=sum(o,x=>{let c=0,f=x[O.flg];for(let b=0;b<5;b++)if(f&(1<<b))c++;return c;});
  return {
    n:o.length, corr, prev,
    pCorr:pct(corr,n), pPrev:pct(prev,n),
    cerradas:cerr.length, abiertas:abiertas.length,
    cumplPM:pct(prevCerr,prev||1),
    cumplPlan:pct(planCump,d.pln.length||1),
    mttr, mtbf, disp:mtbf+mttr?mtbf/(mtbf+mttr):0,
    dispReal:hOp?1-hDet/hOp:0,
    backlogHH, backlogSem:backlogHH/(capSem||1),
    costoR:sum(o,x=>x[O.cR]), costoP:sum(o,x=>x[O.cP]),
    costoCorr:sum(o.filter(esCorr),x=>x[O.cR]), costoPrev:sum(o.filter(esPrev),x=>x[O.cR]),
    hhP:sum(o,x=>x[O.hhP]), hhR:sum(o,x=>x[O.hhR]),
    ton:sum(d.prd,p=>p[P.ton]), hOp, hDet,
    calidad:1-pct(flags,o.length*5||1),
    retrasadas:o.filter(x=>x[O.ret]>0).length,
    diasCierre:cerr.length?sum(cerr,x=>x[O.dias]||0)/cerr.length:0,
    fallas:d.avi.length, horasPerdida:sum(d.avi,a=>a[A.dur]),
    consumo:sum(d.con,c=>c[M.imp]),
  };
}
function KPIprev(){ // mismo largo de ventana, desplazado hacia atrás
  const ms=mesesSel(), i0=MESES.indexOf(ms[0]), len=ms.length;
  if(i0-len<0) return null;
  const prevM=new Set(MESES.slice(i0-len,i0));
  const g=(arr,idx,fdim)=>arr.filter(x=>prevM.has(x[idx])&&fdim(x));
  return KPI({
    ord:g(D.ordenes,O.ym,o=>okDim(o[O.area],o[O.lin],o[O.crit])&&(FS.tipo==='Todas'||o[O.tipo]===FS.tipo)),
    avi:g(D.avisos,A.ym,a=>okDim(a[A.area],a[A.lin],a[A.crit])),
    prd:g(D.produccion,P.ym,p=>(FS.area==='Todas'||p[P.area]===FS.area)&&(FS.linea==='Todas'||p[P.lin]===FS.linea)),
    con:g(D.consumos,M.ym,c=>(FS.area==='Todas'||c[M.area]===FS.area)),
    pln:g(D.planes,L.ym,p=>(FS.area==='Todas'||p[L.area]===FS.area)&&(FS.crit==='Todas'||p[L.crit]===FS.crit)),
  });
}
const flag=(o,b)=>(o[O.flg]&(1<<b))!==0;   // 0 sinEq 1 sinAviso 2 cerrSinHH 3 costoSinCierre 4 prevVencida

/* ---- componentes ---- */
function sem(v,g,a,inv){ // inv: menor es mejor
  const ok = inv ? v<=g : v>=g, med = inv ? v<=a : v>=a;
  return ok?'s-g':(med?'s-a':'s-r');
}
function kpiCard(lbl,val,cls,meta,delta,dcls){
 return `<div class="card kpi"><div class="lbl">${lbl}</div><div class="val">${val}</div>
 <div class="meta"><span class="dot ${cls}"></span>${meta}</div>
 ${delta?`<div class="trend ${dcls}">${delta}</div>`:''}</div>`;}
function nar(t,q,c,r,d){return `<div class="insight full"><h4>${t}</h4><div class="cols">
 <div class="cl"><b>Qué dice el dato</b><p>${q}</p></div>
 <div class="cl"><b>Correlación</b><p>${c}</p></div>
 <div class="cl"><b>Riesgo si no se actúa</b><p>${r}</p></div></div>
 <div class="dec"><b>Decisión recomendada:</b> ${d}</div></div>`;}
function delta(cur,prv,inv,suf){
  if(prv===null||prv===undefined||!isFinite(prv)) return ['',''];
  const d=cur-prv; if(Math.abs(d)<1e-9) return ['—','flat'];
  const bien = inv ? d<0 : d>0;
  const s=(d>0?'▲ ':'▼ ')+Math.abs(d).toFixed(1).replace('.',',')+(suf||'');
  return [s, bien?'up':'down'];
}

/* ============================ PÁGINAS 1–4 ============================ */
const PAGES=[
 {id:1,t:'Resumen Ejecutivo Gerencial',o:'Salud global de la gestión en una vista'},
 {id:2,t:'Gestión de Órdenes',o:'Controlar el flujo de órdenes y la disciplina de cierre'},

 {id:4,t:'Confiabilidad',o:'Identificar malos actores y priorizar mejora'},
 {id:5,t:'Costos',o:'Controlar el gasto y su varianza'},
 {id:6,t:'Backlog y Capacidad',o:'Equilibrar carga y capacidad'},
 {id:7,t:'Materiales y Repuestos',o:'Asegurar disponibilidad de repuestos críticos'},
 {id:8,t:'Calidad de Datos SAP',o:'Sanear el dato como condición habilitante'},
 {id:9,t:'TPM y 5 Fundacionales',o:'Medir madurez y orientar la mejora cultural'},
 {id:10,t:'Drillthrough de Equipo',o:'Diagnóstico 360° de un activo'},
 {id:11,t:'Mejora Enfocada',o:'Convertir pérdidas en iniciativas con ahorro verificable'},
 {id:12,t:'Benchmark Externo',o:'Distancia al cuartil superior y valor de la brecha'},
];

function scores(k,d){ // madurez 1–5 por pilar, derivada del dato real
  const sinEq=pct(d.ord.filter(o=>flag(o,0)).length,d.ord.length||1);
  const sinHH=pct(d.ord.filter(o=>flag(o,2)).length,d.ord.length||1);
  const r=(v,lo,hi)=>Math.max(1,Math.min(5,1+4*(v-lo)/(hi-lo)));
  return {
    F1:r(1-sinEq,.80,1), F2:r(k.cumplPlan,.60,.98), F3:r(1-sinHH,.80,1),
    F4:r(1-Math.abs(k.costoR-k.costoP)/(k.costoP||1),.70,1), F5:r(k.disp,.80,.96),
  };
}

const B={};

/* ---------------- 1 · RESUMEN EJECUTIVO ---------------- */
B[1]=()=>{
 const d=F(), k=KPI(d), p=KPIprev(), s=scores(k,d);
 const eqF=topN(agrupa(d.avi,a=>a[A.eqn]),v=>v.length,6);
 const eqC=topN(agrupa(d.ord,o=>o[O.eqn]),v=>sum(v,x=>x[O.cR]),6);
 const top=eqF[0]||['—',0], topc=eqC[0]||['—',0];
 const dCorr=delta(k.pCorr*100,p?p.pCorr*100:null,true,'pp');
 const dPM  =delta(k.cumplPM*100,p?p.cumplPM*100:null,false,'pp');
 const dCal =delta(k.calidad*100,p?p.calidad*100:null,false,'pp');
 const dCost=delta(k.costoR/1000,p?p.costoR/1000:null,true,'');
 const dDisp=delta(k.dispReal*100,p?p.dispReal*100:null,false,'pp');
 const alertas=[];
 if(k.cumplPM<.90) alertas.push(['s-r',`Cumplimiento preventivo en ${fp0(k.cumplPM)} — bajo la meta de 90%`]);
 if(k.calidad<.95) alertas.push(['s-a',`Calidad de datos en ${fp0(k.calidad)}: ${d.ord.filter(o=>flag(o,1)).length} órdenes sin aviso`]);
 if(top[1]>0) alertas.push(['s-r',`${top[0]} encabeza el ranking de fallas con ${top[1]} eventos`]);
 if(k.backlogSem>4) alertas.push(['s-a',`Backlog en ${fn(k.backlogSem)} semanas — sobre el rango sano de 2 a 4`]);
 if(k.pCorr>.30) alertas.push(['s-r',`Mix correctivo en ${fp0(k.pCorr)} — sobre la meta de 30%`]);
 const bajos=D.materiales.filter(m=>m[6]&&m[3]<=m[4]).length;
 if(bajos) alertas.push(['s-r',`${bajos} repuestos críticos bajo stock — riesgo de parada extendida`]);
 const viejas=d.ord.filter(o=>o[O.est]==='Abierta'&&o[O.ret]>30).length;
 if(viejas) alertas.push(['s-a',`${viejas} órdenes abiertas con más de 30 días de retraso`]);
 const espRep=d.ord.filter(o=>o[O.mot]==='Espera de repuesto').length;
 if(espRep) alertas.push(['s-a',`${espRep} órdenes detenidas esperando material`]);
 const worst=[...Object.entries(s)].sort((a,b)=>a[1]-b[1])[0];
 if(worst[1]<3.5) alertas.push(['s-a',`Pilar ${worst[0]} con madurez ${fn(worst[1])} — limita su KPI asociado`]);
 if(!alertas.length) alertas.push(['s-g','Todos los indicadores dentro de umbral para este filtro.']);
 return `
 <div class="grid g4">
  ${kpiCard('% Órdenes Correctivas',fp0(k.pCorr),sem(k.pCorr,.30,.45,true),'Meta ≤ 30%',dCorr[0],dCorr[1])}
  ${kpiCard('Cumplimiento Preventivo',fp0(k.cumplPM),sem(k.cumplPM,.90,.80),'Meta ≥ 90%',dPM[0],dPM[1])}
  ${kpiCard('Disponibilidad Operac.',fp0(k.dispReal),sem(k.dispReal,.92,.88),'Meta ≥ 92%',dDisp[0],dDisp[1])}
  ${kpiCard('Calidad de Datos SAP',fp0(k.calidad),sem(k.calidad,.95,.85),'Meta ≥ 95%',dCal[0],dCal[1])}
  ${kpiCard('MTTR (h)',fn(k.mttr),sem(k.mttr,8,12,true),'tendencia ↓',...delta(k.mttr,p?p.mttr:null,true,' h'))}
  ${kpiCard('MTBF (h)',mi(k.mtbf),sem(k.mtbf,250,180),'tendencia ↑',...delta(k.mtbf,p?p.mtbf:null,false,' h'))}
  ${kpiCard('Backlog (semanas)',fn(k.backlogSem),sem(k.backlogSem,4,6,true),'Meta 2–4 sem','','')}
  ${kpiCard('Costo Total (M$)',fm(k.costoR),sem(k.costoR,k.costoP,k.costoP*1.1,true),'vs. plan '+fm(k.costoP),dCost[0],dCost[1])}
 </div>
 <div class="grid g3" style="margin-top:13px">
  <div class="card"><h3>Semáforo por pilar fundacional</h3><div class="cap">Score de madurez 1–5 derivado del propio dato SAP</div>
   <div class="pilars">${[['F1 · Activos',s.F1],['F2 · Planificación',s.F2],['F3 · Ejecución',s.F3],['F4 · Costos',s.F4],['F5 · Confiabilidad',s.F5]]
    .map(x=>{const c=x[1]>=4?'s-g':(x[1]>=3?'s-a':'s-r');const col=x[1]>=4?C.green:(x[1]>=3?C.amber:C.red);
     return `<div class="pilar"><span class="sem ${c}"></span><span style="width:118px">${x[0]}</span>
     <span class="bar"><i style="width:${x[1]/5*100}%;background:${col}"></i></span><span style="width:26px;text-align:right;font-weight:700">${fn(x[1])}</span></div>`;}).join('')}</div>
   <div class="mini">Un pilar bajo 3,0 explica por qué su KPI asociado no mejora.</div></div>
  <div class="card"><h3>Tendencia de costo total</h3><div class="cap">M$ por mes · real vs. plan</div><div class="chart-wrap chart-sm"><canvas id="c1a"></canvas></div></div>
  <div class="card"><h3>Mix correctivo / preventivo</h3><div class="cap">% mensual sobre el total de órdenes</div><div class="chart-wrap chart-sm"><canvas id="c1b"></canvas></div></div>
 </div>
 <div class="grid g3" style="margin-top:13px">
  <div class="card"><h3>Top equipos por costo</h3><div class="cap">M$ acumulado en el período</div><div class="chart-wrap"><canvas id="c1c"></canvas></div></div>
  <div class="card"><h3>Top equipos por fallas</h3><div class="cap">N° de avisos registrados</div><div class="chart-wrap"><canvas id="c1d"></canvas></div></div>
  <div class="card"><h3>Alertas críticas</h3><div class="cap">Desvíos que requieren decisión</div>
   ${alertas.length?`<div style="display:flex;flex-direction:column;gap:7px;margin-top:4px">${alertas.map(a=>`<div style="display:flex;gap:8px;align-items:flex-start;font-size:11.5px;line-height:1.45"><span class="sem ${a[0]}" style="margin-top:4px"></span><span>${a[1]}</span></div>`).join('')}</div>`
   :`<div class="empty">Sin desvíos sobre umbral en este filtro.</div>`}</div>
 </div>`+
 nar('Lectura ejecutiva del período',
  `Sobre <em>${mi(k.n)} órdenes</em>, el mix correctivo es <em>${fp0(k.pCorr)}</em> y la disponibilidad <em>${fp0(k.dispReal)}</em>. El cumplimiento preventivo alcanza <em>${fp0(k.cumplPM)}</em>.`,
  `<em>${top[0]}</em> lidera el ranking de fallas (${top[1]} avisos) y <em>${topc[0]}</em> el de costo (M$ ${fm(topc[1])}). Las horas de detención del período suman <em>${mi(k.horasPerdida)} h</em>, concentradas en los equipos de criticidad A.`,
  k.cumplPM<.9?`Con el preventivo bajo meta, el correctivo tiende a recuperar terreno y el backlog (${fn(k.backlogSem)} sem) crece sobre la capacidad disponible.`
              :`El desempeño actual es sostenible, pero depende de mantener la disciplina de ejecución preventiva.`,
  `Priorizar los planes vencidos de los dos equipos con mayor frecuencia de falla y abrir un A3 de Mejora Enfocada sobre averías en ${top[0]}.`);
};

/* ---------------- 2 · GESTIÓN DE ÓRDENES ---------------- */
B[2]=()=>{
 const d=F(), k=KPI(d);
 const retras=d.ord.filter(o=>o[O.ret]>0).sort((a,b)=>b[O.ret]-a[O.ret]).slice(0,8);
 const avisos=d.avi.length, ligados=d.avi.filter(a=>a[A.lig]===1).length;
 const ejec=d.ord.length, cerr=k.cerradas, conHH=d.ord.filter(o=>o[O.est]==='Cerrada'&&!flag(o,2)).length;
 const fun=[['Avisos creados',avisos],['Avisos con orden',ligados],['Órdenes ejecutadas',ejec],
            ['Cerradas técnicamente',cerr],['Cerradas con HH confirmadas',conHH]];
 const mx=fun[0][1]||1;
 const mat=D.meta.areas.map(ar=>{const s=d.ord.filter(o=>o[O.area]===ar);
   return [ar, ...D.meta.grupos.map(g=>s.filter(o=>o[O.grp]===g).length),
           s.length?pct(s.filter(o=>o[O.ret]>0).length,s.length):0];});
 return `
 <div class="grid g4">
  ${kpiCard('Órdenes Totales',mi(k.n),'s-g','Volumen del período','','')}
  ${kpiCard('Órdenes Abiertas',mi(k.abiertas),sem(pct(k.abiertas,k.n),.12,.20,true),fp0(pct(k.abiertas,k.n))+' del total','','')}
  ${kpiCard('Tiempo Prom. Cierre',fn(k.diasCierre)+' d',sem(k.diasCierre,7,12,true),'tendencia ↓','','')}
  ${kpiCard('% Órdenes Retrasadas',fp0(pct(k.retrasadas,k.n)),sem(pct(k.retrasadas,k.n),.10,.20,true),'Meta ≤ 10%','','')}
 </div>
 <div class="grid g2" style="margin-top:13px">
  <div class="card"><h3>Órdenes por mes · abiertas vs. cerradas</h3><div class="cap">Conteo mensual</div><div class="chart-wrap"><canvas id="c2a"></canvas></div></div>
  <div class="card"><h3>Distribución por clase de orden</h3><div class="cap">Clases SAP PM01 a PM06</div><div class="chart-wrap"><canvas id="c2b"></canvas></div></div>
 </div>
 <div class="grid g2" style="margin-top:13px">

   <div class="funnel">${fun.map((r,i)=>`<div class="fstep"><span class="fn">${r[0]}</span>

    <span class="fv">${mi(r[1])}</span><span class="fp">${Math.round(r[1]/mx*100)}%</span></div>`).join('')}</div>

  <div class="card"><h3>Cumplimiento de programación semanal</h3><div class="cap">% de órdenes cerradas dentro del mes de creación</div><div class="chart-wrap"><canvas id="c2c"></canvas></div>

   return [eqn,eq[4]||'—',f,hOp/(f||1),cerrC.length?sum(cerrC,x=>x[O.hhR])/cerrC.length:0,sum(os,x=>x[O.cR])];

   backgroundColor:gq.map(x=>x[1]>=95?C.green:x[1]>=88?C.amber:C.red)}],

 }
 if(id===9){
  const s=scores(k,d);
  const c=G('c9a'); if(c) charts.push(new Chart(c,{type:'radar',
   data:{labels:['Activos','Planificación','Ejecución','Costos','Confiabilidad'],datasets:[

   options:base({scales:{r:{min:0,max:5,ticks:{stepSize:1}}}})}));
  bars('c9b',['F1','F2','F3','F4','F5'],[{data:[s.F1,s.F2,s.F3,s.F4,s.F5].map(v=>+v.toFixed(2)),

   {plugins:{legend:{display:false}},scales:{y:{max:5}}});
  lines('c9c',lab,[
   {label:'Madurez promedio',data:ms.map(ym=>{
     const dm={ord:d.ord.filter(o=>o[O.ym]===ym),avi:d.avi.filter(a=>a[A.ym]===ym),
               prd:d.prd.filter(p=>p[P.ym]===ym),con:d.con.filter(c=>c[M.ym]===ym),pln:d.pln.filter(p=>p[L.ym]===ym)};
     const sk=scores(KPI(dm),dm); return +((sk.F1+sk.F2+sk.F3+sk.F4+sk.F5)/5).toFixed(2);}),
    borderColor:C.blue,tension:.3,pointRadius:3},
   {label:'Meta 4,0',data:lab.map(()=>4),borderColor:C.orange,borderDash:[5,4],pointRadius:0}],
   {scales:{y:{min:1,max:5,ticks:{stepSize:1}}}});
 }
 if(id===10){
  const av=d.avi.filter(a=>a[A.eq]===FS.equipo), os=d.ord.filter(o=>o[O.eq]===FS.equipo);
  lines('c10a',lab,[
   {type:'bar',label:'Fallas',data:pm(av,A.ym,s=>s.length),backgroundColor:C.orange,yAxisID:'y'},
   {label:'Costo M$',data:pm(os,O.ym,s=>+(sum(s,x=>x[O.cR])/1000).toFixed(2)),borderColor:C.navy,yAxisID:'y1',tension:.3}],
   {scales:{y:{position:'left',title:{display:true,text:'Fallas'}},
            y1:{position:'right',grid:{drawOnChartArea:false},title:{display:true,text:'M$'}}}});
 }
 if(id===11){
  const cats=['Averías','Paradas menores','Setup y ajustes','Pérdida de velocidad','Defectos y reproceso','Arranque'];
  const perd=cats.map(c=>[c,sum(d.avi.filter(a=>a[A.cat]===c),a=>a[A.dur])*MARGEN_HORA/1000]);
  const esf={'Averías':2,'Paradas menores':2,'Setup y ajustes':3,'Pérdida de velocidad':4,'Defectos y reproceso':4,'Arranque':3};
  const col=[C.red,C.orange,C.blue,C.violet,C.amber,C.slate];
  const c=G('c11a'); if(c) charts.push(new Chart(c,{type:'bubble',
   data:{datasets:perd.map((p,i)=>({label:p[0],data:[{x:esf[p[0]],y:+p[1].toFixed(1),r:Math.max(6,Math.min(26,p[1]*1.6))}],
    backgroundColor:col[i]+'A8'}))},
   options:base({scales:{x:{min:0,max:5,title:{display:true,text:'Esfuerzo / complejidad →'},ticks:{stepSize:1}},
    y:{beginAtZero:true,title:{display:true,text:'Impacto M$/año →'}}},plugins:{legend:{position:'bottom'}}})}));
  const kz=D.kaizen.filter(x=>ms.some(m=>m>=x[7]));
  let ac=0; const acum=ms.map(ym=>{ac+=sum(kz.filter(x=>x[7]===ym&&x[5]==='Act'),x=>x[6]);return +(ac/1000).toFixed(1);});
  const meta=ms.map((_,i)=>+((i+1)*(sum(kz.filter(x=>x[5]==='Act'),x=>x[6])/1000)/ms.length*1.05).toFixed(1));
  lines('c11b',lab,[
   {label:'Ahorro validado acum.',data:acum,borderColor:C.green,backgroundColor:'rgba(18,128,92,.16)',fill:true,tension:.3},
   {label:'Meta acumulada',data:meta,borderColor:C.orange,borderDash:[5,4],pointRadius:0}],
   {scales:{y:{title:{display:true,text:'M$'}}}});
 }
 if(id===12){
  const planif=(1-k.pCorr)*100, oee=k.dispReal*0.86*0.94*100;
  bars('c12a',['% Planificado','Disponibilidad','Cumpl. PM','Calidad datos','OEE parcial'],[
   {label:'Actual',data:[planif,k.dispReal*100,k.cumplPlan*100,k.calidad*100,oee].map(v=>+v.toFixed(1)),backgroundColor:C.blue},
   {label:'Cuartil superior',data:[85,95,95,95,85],backgroundColor:C.navy}],
   {indexAxis:'y',scales:{x:{max:100,...pctFmt}},plugins:{legend:{position:'bottom'}}});
  bars('c12b',['Averías','Reactivo→Plan','Repuestos','Setup','Velocidad'],
   [{data:[8.4,5.2,3.1,2.6,2.3],backgroundColor:[C.red,C.orange,C.blue,C.amber,C.violet]}],
   {plugins:{legend:{display:false}},scales:{y:{title:{display:true,text:'M$/año'}}}});
 }
}

function chips(){
 document.querySelectorAll('#canvas .card h3').forEach(h=>{
  if(h.querySelector('.sapchip'))return; const t=h.textContent.trim();
  for(const k in SAP){ if(t.startsWith(k)){h.insertAdjacentHTML('beforeend',`<span class="sapchip">${SAP[k]}</span>`);break;} }});
 document.querySelectorAll('#canvas .kpi .lbl').forEach(l=>{
  if(l.querySelector('.sapchip'))return; const t=l.textContent.trim();
  if(SAP[t]) l.insertAdjacentHTML('beforeend',`<span class="sapchip">${SAP[t]}</span>`);});
}

/* ============================ FILTROS Y NAVEGACIÓN ============================ */
let cur=1, RID=0;
function buildFilters(){
 const sel=(id,lbl,opts,val)=>`<div class="fl"><label>${lbl}</label><select id="${id}" onchange="setF('${id}',this.value)">
  ${opts.map(o=>`<option value="${o[0]}"${o[0]===val?' selected':''}>${o[1]}</option>`).join('')}</select></div>`;
 let h=sel('periodo','Periodo',Object.entries(PERIODOS).map(([k,v])=>[k,v.n]),FS.periodo)
  +sel('area','Área',[['Todas','Todas']].concat(D.meta.areas.map(a=>[a,a])),FS.area)
  +sel('linea','Línea',[['Todas','Todas']].concat(D.meta.lineas.map(a=>[a,a])),FS.linea)
  +sel('crit','Criticidad',[['Todas','Todas'],['A','A · Crítico'],['B','B · Esencial'],['C','C · General']],FS.crit)
  +sel('tipo','Tipo de orden',[['Todas','Todas']].concat(D.meta.tipos.map(t=>[t,t])),FS.tipo);
 if(cur===10) h+=sel('equipo','Equipo',D.equipos.map(e=>[e[0],e[1]]),FS.equipo);
 const d=F();
 h+=`<div class="fstat">${mi(d.ord.length)} órdenes · ${mi(d.avi.length)} avisos · ${mesesSel().length} meses</div>`;
 document.getElementById('filters').innerHTML=h;
}
function setF(k,v){FS[k]=v; render();}
function resetFilters(){FS.periodo='todo';FS.area='Todas';FS.linea='Todas';FS.crit='Todas';FS.tipo='Todas';render();}
function toggleFilters(){document.getElementById('filters').classList.toggle('hidden');}
function setView(v){document.getElementById('vGer').classList.toggle('on',v==='ger');
 document.getElementById('vTec').classList.toggle('on',v==='tec');
 document.getElementById('canvas').classList.toggle('gerencial',v==='ger');}
function goto(id){cur=id;render();window.scrollTo(0,0);}
function render(){
 const p=PAGES.find(x=>x.id===cur);
 document.getElementById('ptitle').childNodes[0].nodeValue=p.t;
 document.getElementById('psub').textContent=p.o;
 [...document.querySelectorAll('#nav button')].forEach(b=>b.classList.toggle('active',+b.dataset.id===cur));
 kill(); RID++;
 buildFilters();
 const d=F();
 document.getElementById('canvas').innerHTML = d.ord.length
   ? B[cur]()
   : `<div class="card"><div class="empty">No hay órdenes que cumplan esta combinación de filtros.<br>Ajusta el período, el área o la criticidad.</div></div>`;
 chips();
 const myRid=++RID;
 if(d.ord.length) setTimeout(()=>{ if(myRid===RID) draw(cur); },20);
}
document.getElementById('nav').innerHTML=PAGES.map(p=>
 `<button data-id="${p.id}" onclick="goto(${p.id})"><span class="num">${p.id}</span><span class="txt">${p.t}</span></button>`).join('');
document.getElementById('foot').innerHTML=
 `Dataset sintético · ${D.meta.meses.length} meses<br>${mi(D.ordenes.length)} órdenes · ${mi(D.avisos.length)} avisos<br>Mejora Enfocada (Kobetsu Kaizen) + TPM`;
render();

</script>
